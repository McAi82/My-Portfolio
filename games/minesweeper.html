<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Mcyor · MINESWEEPER | 3D NEON</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --neon-cyan: #0ff;
        --neon-pink: #f0f;
        --neon-purple: #b624ff;
        --glow-cyan: rgba(0, 255, 255, 0.6);
      }
      body {
        background: radial-gradient(circle at 20% 30%, #03050b, #000);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        position: relative;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        animation: gridFloat 20s infinite alternate;
      }
      @keyframes gridFloat {
        0% {
          transform: translateZ(0) rotateX(0deg);
          opacity: 0.3;
        }
        100% {
          transform: translateZ(10px) rotateX(2deg);
          opacity: 0.7;
        }
      }
      .game-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 750px;
        perspective: 1200px;
      }
      .game-panel {
        background: rgba(5, 8, 18, 0.85);
        backdrop-filter: blur(12px);
        border-radius: 2rem;
        padding: 1.2rem;
        border: 1px solid rgba(0, 255, 255, 0.4);
        box-shadow:
          0 25px 45px -12px black,
          0 0 0 2px rgba(0, 255, 255, 0.2) inset,
          0 0 18px var(--glow-cyan);
      }
      .game-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 1rem;
        border-bottom: 2px solid var(--neon-cyan);
        padding-bottom: 0.7rem;
      }
      .game-title {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .stats-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.8rem;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 60px;
        padding: 0.5rem 1rem;
        margin-bottom: 1rem;
        border: 1px solid rgba(0, 255, 255, 0.3);
      }
      .stat {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        font-family: "JetBrains Mono", monospace;
      }
      .stat-value {
        font-family: "Syne", sans-serif;
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--neon-cyan);
        text-shadow: 0 0 8px var(--neon-cyan);
      }
      button,
      select {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid var(--neon-cyan);
        padding: 0.4rem 0.8rem;
        border-radius: 40px;
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
        font-size: 0.7rem;
        color: var(--neon-cyan);
        cursor: pointer;
        transition: all 0.2s;
      }
      button:hover,
      select:hover {
        background: var(--neon-cyan);
        color: #000;
        box-shadow: 0 0 15px var(--glow-cyan);
      }
      .canvas-area {
        background: rgba(0, 0, 0, 0.55);
        border-radius: 24px;
        padding: 1rem;
        border: 1px solid rgba(0, 255, 255, 0.4);
        display: flex;
        justify-content: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 16px;
        box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.3);
        background: #000;
        cursor: pointer;
      }
      .touch-controls {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      .touch-btn {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid var(--neon-cyan);
        padding: 0.6rem 1.2rem;
        border-radius: 40px;
        color: var(--neon-cyan);
        font-weight: bold;
        font-size: 0.8rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .touch-btn:active {
        background: var(--neon-cyan);
        color: #000;
        transform: scale(0.95);
      }
      @media (max-width: 600px) {
        .game-title {
          font-size: 1rem;
        }
        .stat-value {
          font-size: 1rem;
        }
        .touch-btn {
          padding: 0.4rem 0.8rem;
          font-size: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-panel">
        <div class="game-header">
          <span class="game-title">💣 MINESWEEPER · 3D NEON</span
          ><span style="color: #0ff">⚡</span>
        </div>
        <div class="stats-row">
          <div class="stat">
            <span class="stat-value" id="minesLeft">0</span><span>MINES</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="gameStatus">READY</span
            ><span>STATUS</span>
          </div>
          <select id="difficulty">
            <option value="easy">EASY 8x8</option>
            <option value="normal" selected>NORMAL 16x16</option>
            <option value="hard">HARD 16x30</option>
          </select>
          <button id="resetBtn">⟳ RESTART</button>
        </div>
        <div class="canvas-area">
          <canvas id="boardCanvas" width="400" height="400"></canvas>
        </div>
        <div class="touch-controls">
          <div class="touch-btn" id="touchFlag">🚩 FLAG</div>
          <div class="touch-btn" id="touchReveal">💣 REVEAL</div>
        </div>
        <div
          style="
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.6rem;
            color: #5e6f8d;
          "
        >
          🖱️ Click: Reveal | Right-click/Long press: Flag | Mobile: Use buttons
        </div>
      </div>
    </div>
    <script>
      const canvas = document.getElementById("boardCanvas"),
        ctx = canvas.getContext("2d");
      let rows = 16,
        cols = 16,
        totalMines = 40,
        board = [],
        flagsPlaced = 0,
        gameActive = true,
        firstClick = true,
        winFlag = false;
      let cellW = 0,
        cellH = 0;
      const minesSpan = document.getElementById("minesLeft"),
        statusSpan = document.getElementById("gameStatus"),
        resetBtn = document.getElementById("resetBtn"),
        diffSelect = document.getElementById("difficulty");

      function setDifficulty(mode) {
        if (mode === "easy") {
          rows = 8;
          cols = 8;
          totalMines = 10;
        } else if (mode === "normal") {
          rows = 16;
          cols = 16;
          totalMines = 40;
        } else {
          rows = 16;
          cols = 30;
          totalMines = 99;
        }
      }
      function resizeCanvas() {
        const container = canvas.parentElement,
          maxSize = Math.min(
            container.clientWidth - 20,
            window.innerWidth - 60,
            550,
          );
        canvas.style.width = `${maxSize}px`;
        canvas.style.height = `${maxSize}px`;
        canvas.width = maxSize * devicePixelRatio;
        canvas.height = maxSize * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        cellW = maxSize / cols;
        cellH = maxSize / rows;
        drawBoard();
      }
      function initBoard() {
        board = [];
        for (let r = 0; r < rows; r++) {
          board[r] = [];
          for (let c = 0; c < cols; c++)
            board[r][c] = {
              mine: false,
              revealed: false,
              flagged: false,
              adjacent: 0,
            };
        }
        flagsPlaced = 0;
        gameActive = true;
        firstClick = true;
        winFlag = false;
        statusSpan.innerText = "READY";
        updateMines();
      }
      function placeMines(exR, exC) {
        let placed = 0;
        while (placed < totalMines) {
          let r = Math.floor(Math.random() * rows),
            c = Math.floor(Math.random() * cols);
          if (board[r][c].mine) continue;
          if (Math.abs(r - exR) <= 1 && Math.abs(c - exC) <= 1) continue;
          board[r][c].mine = true;
          placed++;
        }
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++) {
            if (board[r][c].mine) {
              board[r][c].adjacent = -1;
              continue;
            }
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++)
              for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr,
                  nc = c + dc;
                if (
                  nr >= 0 &&
                  nr < rows &&
                  nc >= 0 &&
                  nc < cols &&
                  board[nr][nc].mine
                )
                  cnt++;
              }
            board[r][c].adjacent = cnt;
          }
      }
      function revealCell(r, c) {
        if (!gameActive) return;
        if (r < 0 || r >= rows || c < 0 || c >= cols) return;
        let cell = board[r][c];
        if (cell.revealed || cell.flagged) return;
        cell.revealed = true;
        if (cell.mine) {
          gameActive = false;
          statusSpan.innerText = "💥 BOOM";
          revealAllMines();
          drawBoard();
          setTimeout(() => alert("💀 Game Over!"), 30);
          return;
        }
        if (cell.adjacent === 0) {
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++)
              if (dr !== 0 || dc !== 0) revealCell(r + dr, c + dc);
        }
        checkWin();
      }
      function revealAllMines() {
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            if (board[r][c].mine) board[r][c].revealed = true;
      }
      function toggleFlag(r, c) {
        if (!gameActive) return;
        let cell = board[r][c];
        if (cell.revealed) return;
        if (!cell.flagged) {
          if (flagsPlaced >= totalMines) return;
          cell.flagged = true;
          flagsPlaced++;
        } else {
          cell.flagged = false;
          flagsPlaced--;
        }
        updateMines();
        drawBoard();
        checkWin();
      }
      function checkWin() {
        let safeRevealed = 0;
        let totalSafe = rows * cols - totalMines;
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            if (!board[r][c].mine && board[r][c].revealed) safeRevealed++;
        if (safeRevealed === totalSafe && !winFlag) {
          gameActive = false;
          winFlag = true;
          statusSpan.innerText = "✨ VICTORY!";
          drawBoard();
          setTimeout(() => alert("🎉 You Won!"), 30);
        }
      }
      function updateMines() {
        minesSpan.innerText = Math.max(0, totalMines - flagsPlaced);
      }
      function drawBoard() {
        ctx.fillStyle = "#03050b";
        ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            let x = c * cellW,
              y = r * cellH,
              cell = board[r][c];
            if (cell.revealed) {
              ctx.fillStyle = "#0a0f14";
              ctx.fillRect(x, y, cellW, cellH);
              if (cell.mine) {
                ctx.fillStyle = "#ff3b5c";
                ctx.beginPath();
                ctx.arc(
                  x + cellW / 2,
                  y + cellH / 2,
                  cellW * 0.28,
                  0,
                  Math.PI * 2,
                );
                ctx.fill();
              } else if (cell.adjacent > 0) {
                let colors = [
                  "#0ff",
                  "#0f0",
                  "#ff0",
                  "#f0f",
                  "#ff6600",
                  "#ff0066",
                ];
                ctx.fillStyle = colors[(cell.adjacent - 1) % colors.length];
                ctx.font = `bold ${Math.max(12, cellW * 0.5)}px "JetBrains Mono", monospace`;
                ctx.fillText(cell.adjacent, x + cellW * 0.35, y + cellH * 0.7);
              }
            } else {
              ctx.fillStyle = "#11161f";
              ctx.fillRect(x, y, cellW, cellH);
              ctx.strokeStyle = "rgba(0,255,255,0.3)";
              ctx.strokeRect(x + 0.5, y + 0.5, cellW - 1, cellH - 1);
              if (cell.flagged) {
                ctx.fillStyle = "#0ff";
                ctx.beginPath();
                ctx.moveTo(x + cellW * 0.45, y + cellH * 0.7);
                ctx.lineTo(x + cellW * 0.55, y + cellH * 0.7);
                ctx.lineTo(x + cellW * 0.5, y + cellH * 0.4);
                ctx.fill();
                ctx.fillRect(
                  x + cellW * 0.48,
                  y + cellH * 0.28,
                  cellW * 0.04,
                  cellH * 0.42,
                );
              }
            }
          }
        }
      }
      function getCellFromXY(clientX, clientY) {
        let rect = canvas.getBoundingClientRect(),
          scaleX = canvas.clientWidth / rect.width,
          scaleY = canvas.clientHeight / rect.height,
          mouseX = (clientX - rect.left) * scaleX,
          mouseY = (clientY - rect.top) * scaleY,
          c = Math.floor(mouseX / cellW),
          r = Math.floor(mouseY / cellH);
        return { r, c };
      }
      let longPressTimer = null;
      canvas.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        let { r, c } = getCellFromXY(e.clientX, e.clientY);
        if (r >= 0 && r < rows && c >= 0 && c < cols) toggleFlag(r, c);
        drawBoard();
      });
      canvas.addEventListener("pointerdown", (e) => {
        let { r, c } = getCellFromXY(e.clientX, e.clientY);
        if (r < 0 || r >= rows || c < 0 || c >= cols) return;
        longPressTimer = setTimeout(() => {
          toggleFlag(r, c);
          drawBoard();
          longPressTimer = null;
        }, 500);
      });
      canvas.addEventListener("pointerup", (e) => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          let { r, c } = getCellFromXY(e.clientX, e.clientY);
          if (
            r >= 0 &&
            r < rows &&
            c >= 0 &&
            c < cols &&
            !board[r][c].flagged
          ) {
            if (firstClick) {
              placeMines(r, c);
              firstClick = false;
            }
            revealCell(r, c);
            drawBoard();
          }
        }
      });
      canvas.addEventListener("pointercancel", () => {
        if (longPressTimer) clearTimeout(longPressTimer);
      });
      document.getElementById("touchFlag").onclick = () => {
        if (!gameActive) return;
        alert("Tap a cell to place/remove flag");
      };
      document.getElementById("touchReveal").onclick = () => {
        if (!gameActive) return;
        alert("Tap a cell to reveal");
      };
      resetBtn.onclick = () => {
        setDifficulty(diffSelect.value);
        initBoard();
        resizeCanvas();
        drawBoard();
      };
      diffSelect.onchange = () => {
        setDifficulty(diffSelect.value);
        initBoard();
        resizeCanvas();
        drawBoard();
      };
      window.addEventListener("resize", () => {
        resizeCanvas();
        drawBoard();
      });
      setDifficulty("normal");
      initBoard();
      resizeCanvas();
      drawBoard();
    </script>
  </body>
</html>
