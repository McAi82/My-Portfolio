<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Mcyor · TETRIS | 3D NEON</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: radial-gradient(circle at 20% 30%, #03050b, #000);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        animation: gridFloat 20s infinite alternate;
      }
      @keyframes gridFloat {
        0% {
          transform: translateZ(0) rotateX(0deg);
          opacity: 0.3;
        }
        100% {
          transform: translateZ(10px) rotateX(2deg);
          opacity: 0.7;
        }
      }
      .game-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 550px;
        perspective: 1200px;
        margin: 0 auto;
      }
      .game-panel {
        background: rgba(5, 8, 18, 0.85);
        backdrop-filter: blur(12px);
        border-radius: 1.5rem;
        padding: 0.8rem;
        border: 1px solid rgba(0, 255, 255, 0.4);
        box-shadow:
          0 25px 45px -12px black,
          0 0 0 2px rgba(0, 255, 255, 0.2) inset,
          0 0 18px rgba(0, 255, 255, 0.6);
      }
      .game-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 0.8rem;
        border-bottom: 2px solid #0ff;
        padding-bottom: 0.5rem;
      }
      .game-title {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 1.2rem;
        background: linear-gradient(135deg, #0ff, #f0f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .stats-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 40px;
        padding: 0.4rem 0.8rem;
        margin-bottom: 0.8rem;
        border: 1px solid rgba(0, 255, 255, 0.3);
      }
      .stat {
        display: flex;
        gap: 0.3rem;
        align-items: baseline;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
      }
      .stat-value {
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 800;
        color: #0ff;
        text-shadow: 0 0 5px #0ff;
      }
      button {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #0ff;
        padding: 0.3rem 0.6rem;
        border-radius: 40px;
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
        font-size: 0.65rem;
        color: #0ff;
        cursor: pointer;
        transition: all 0.2s;
      }
      button:hover,
      button:active {
        background: #0ff;
        color: #000;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
      }

      /* FLEXIBLE GAME AREA - MOBILE FIRST */
      .game-area {
        display: flex;
        gap: 0.8rem;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .canvas-area {
        background: rgba(0, 0, 0, 0.55);
        border-radius: 20px;
        padding: 0.4rem;
        border: 1px solid rgba(0, 255, 255, 0.4);
      }
      #tetrisCanvas {
        width: 100%;
        height: auto;
        max-width: 280px;
        display: block;
      }
      #nextCanvas {
        width: 80px;
        height: 80px;
        display: block;
      }
      .info-panel {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: center;
      }
      .info-panel .canvas-area {
        padding: 0.3rem;
      }
      .info-panel .canvas-area div {
        font-size: 0.55rem;
        margin-top: 0.2rem;
      }

      /* COMPACT D-PAD */
      .dpad {
        display: flex;
        justify-content: center;
        gap: 0.4rem;
        margin-top: 0.8rem;
        flex-wrap: wrap;
      }
      .dpad button {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #0ff;
        color: #0ff;
        cursor: pointer;
        transition: 0.05s linear;
      }
      .dpad button:active {
        background: #0ff;
        color: #000;
        transform: scale(0.92);
      }

      /* MOBILE OPTIMIZATIONS */
      @media (max-width: 550px) {
        body {
          padding: 0.5rem;
        }
        .game-panel {
          padding: 0.6rem;
        }
        .game-title {
          font-size: 1rem;
        }
        .stat-value {
          font-size: 0.85rem;
        }
        .stat {
          font-size: 0.6rem;
        }
        button {
          padding: 0.25rem 0.5rem;
          font-size: 0.6rem;
        }
        .dpad button {
          width: 45px;
          height: 45px;
          font-size: 1rem;
        }
        #tetrisCanvas {
          max-width: 240px;
        }
        #nextCanvas {
          width: 70px;
          height: 70px;
        }
      }

      @media (max-width: 450px) {
        .dpad button {
          width: 40px;
          height: 40px;
          font-size: 0.9rem;
        }
        #tetrisCanvas {
          max-width: 210px;
        }
        #nextCanvas {
          width: 60px;
          height: 60px;
        }
        .stats-row {
          gap: 0.3rem;
        }
      }

      @media (max-width: 380px) {
        .game-area {
          gap: 0.4rem;
        }
        #tetrisCanvas {
          max-width: 190px;
        }
        .dpad button {
          width: 38px;
          height: 38px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-panel">
        <div class="game-header">
          <span class="game-title">◈ TETRIS · 3D NEON</span>
          <span style="color: #0ff; font-size: 0.7rem">⚡ MOBILE</span>
        </div>
        <div class="stats-row">
          <div class="stat">
            <span class="stat-value" id="tetrisScore">0</span><span>SCORE</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="tetrisLines">0</span><span>LINES</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="tetrisLevel">1</span><span>LVL</span>
          </div>
          <button id="tetrisStart">START</button>
          <button id="tetrisReset">RESET</button>
        </div>
        <div class="game-area">
          <div class="canvas-area">
            <canvas
              id="tetrisCanvas"
              width="300"
              height="400"
              style="
                width: 100%;
                height: auto;
                max-width: 280px;
                max-height: 400px;
              "
            ></canvas>
          </div>
          <div class="info-panel">
            <div class="canvas-area">
              <canvas
                id="nextCanvas"
                width="120"
                height="120"
                style="width: 80px; height: 80px"
              ></canvas>
              <div style="text-align: center; font-size: 0.55rem; color: #0ff">
                NEXT
              </div>
            </div>
          </div>
        </div>
        <div class="dpad">
          <button id="tetrisLeft">◀</button>
          <button id="tetrisRight">▶</button>
          <button id="tetrisRotate">↻</button>
          <button id="tetrisDown">▼</button>
          <button id="tetrisDrop">⬇⬇</button>
        </div>
        <div
          style="
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.55rem;
            color: #5e6f8d;
          "
        >
          ◉ ◀ ▶ ▼ | ROTATE ↻ | HARD DROP ⬇⬇
        </div>
      </div>
    </div>

    <script>
      (function () {
        // CANVAS
        const canvas = document.getElementById("tetrisCanvas");
        const ctx = canvas.getContext("2d");
        const nextCanvas = document.getElementById("nextCanvas");
        const nextCtx = nextCanvas.getContext("2d");

        // GAME DIMENSIONS
        const COLS = 10;
        const ROWS = 20;
        let BLOCK_SIZE = 30; // Will adjust dynamically

        // Adjust block size based on container
        function adjustBlockSize() {
          const container = canvas.parentElement;
          const maxWidth = Math.min(container.clientWidth, 280);
          BLOCK_SIZE = Math.floor(maxWidth / COLS);
          canvas.width = COLS * BLOCK_SIZE;
          canvas.height = ROWS * BLOCK_SIZE;
          canvas.style.width = `${COLS * BLOCK_SIZE}px`;
          canvas.style.height = `${ROWS * BLOCK_SIZE}px`;

          // Adjust next canvas
          const nextSize = Math.min(80, BLOCK_SIZE * 2.5);
          nextCanvas.width = nextSize;
          nextCanvas.height = nextSize;
          nextCanvas.style.width = `${nextSize}px`;
          nextCanvas.style.height = `${nextSize}px`;
        }

        window.addEventListener("resize", () => {
          adjustBlockSize();
          draw();
          drawNextPiece();
        });
        adjustBlockSize();

        // TETROMINO SHAPES
        const TETROMINOS = [
          { shape: [[1, 1, 1, 1]], color: "#00ffff" }, // I
          {
            shape: [
              [1, 1],
              [1, 1],
            ],
            color: "#ffff00",
          }, // O
          {
            shape: [
              [0, 1, 0],
              [1, 1, 1],
            ],
            color: "#b624ff",
          }, // T
          {
            shape: [
              [0, 1, 1],
              [1, 1, 0],
            ],
            color: "#00ff00",
          }, // S
          {
            shape: [
              [1, 1, 0],
              [0, 1, 1],
            ],
            color: "#ff3b8e",
          }, // Z
          {
            shape: [
              [1, 0, 0],
              [1, 1, 1],
            ],
            color: "#ff6600",
          }, // L
          {
            shape: [
              [0, 0, 1],
              [1, 1, 1],
            ],
            color: "#0066ff",
          }, // J
        ];

        // GAME STATE
        let board = Array(ROWS)
          .fill()
          .map(() => Array(COLS).fill(0));
        let boardColors = Array(ROWS)
          .fill()
          .map(() => Array(COLS).fill("#000"));
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameRunning = false;
        let gameOverFlag = false;

        let currentPiece = null;
        let currentX = 0,
          currentY = 0;
        let nextPiece = null;

        let lastTimestamp = 0;
        let dropCounter = 0;
        let dropInterval = 500;

        const LINE_SCORES = [0, 40, 100, 300, 1200];

        function updateUI() {
          document.getElementById("tetrisScore").innerText = score;
          document.getElementById("tetrisLines").innerText = lines;
          document.getElementById("tetrisLevel").innerText = level;
        }

        function getRandomTetromino() {
          const idx = Math.floor(Math.random() * TETROMINOS.length);
          const tet = TETROMINOS[idx];
          return { shape: tet.shape.map((row) => [...row]), color: tet.color };
        }

        function initNextPiece() {
          if (!nextPiece) nextPiece = getRandomTetromino();
        }

        function spawnNewPiece() {
          if (!nextPiece) nextPiece = getRandomTetromino();
          currentPiece = {
            shape: nextPiece.shape.map((row) => [...row]),
            color: nextPiece.color,
          };
          nextPiece = getRandomTetromino();
          currentX =
            Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
          currentY = 0;
          drawNextPiece();
          if (collision()) {
            gameRunning = false;
            gameOverFlag = true;
            draw();
          }
        }

        function drawNextPiece() {
          nextCtx.fillStyle = "#03050b";
          nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
          if (!nextPiece) return;
          const blockW = nextCanvas.width / 4;
          const blockH = nextCanvas.height / 4;
          const shape = nextPiece.shape;
          const color = nextPiece.color;
          const startX = (nextCanvas.width - shape[0].length * blockW) / 2;
          const startY = (nextCanvas.height - shape.length * blockH) / 2;
          for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[0].length; c++) {
              if (shape[r][c]) {
                nextCtx.fillStyle = color;
                nextCtx.shadowBlur = 4;
                nextCtx.fillRect(
                  startX + c * blockW + 1,
                  startY + r * blockH + 1,
                  blockW - 2,
                  blockH - 2,
                );
                nextCtx.strokeStyle = "#0ff";
                nextCtx.strokeRect(
                  startX + c * blockW + 1,
                  startY + r * blockH + 1,
                  blockW - 2,
                  blockH - 2,
                );
              }
            }
          }
          nextCtx.shadowBlur = 0;
        }

        function collision() {
          for (let r = 0; r < currentPiece.shape.length; r++) {
            for (let c = 0; c < currentPiece.shape[0].length; c++) {
              if (currentPiece.shape[r][c]) {
                const boardX = currentX + c;
                const boardY = currentY + r;
                if (
                  boardX < 0 ||
                  boardX >= COLS ||
                  boardY >= ROWS ||
                  boardY < 0
                )
                  return true;
                if (boardY >= 0 && board[boardY][boardX] === 1) return true;
              }
            }
          }
          return false;
        }

        function mergePiece() {
          for (let r = 0; r < currentPiece.shape.length; r++) {
            for (let c = 0; c < currentPiece.shape[0].length; c++) {
              if (currentPiece.shape[r][c]) {
                const boardX = currentX + c;
                const boardY = currentY + r;
                if (
                  boardY >= 0 &&
                  boardY < ROWS &&
                  boardX >= 0 &&
                  boardX < COLS
                ) {
                  board[boardY][boardX] = 1;
                  boardColors[boardY][boardX] = currentPiece.color;
                }
              }
            }
          }
          clearLines();
          spawnNewPiece();
          updateDropInterval();
        }

        function clearLines() {
          let linesCleared = 0;
          for (let y = ROWS - 1; y >= 0; y--) {
            let full = true;
            for (let x = 0; x < COLS; x++) {
              if (board[y][x] === 0) {
                full = false;
                break;
              }
            }
            if (full) {
              for (let row = y; row > 0; row--) {
                board[row] = [...board[row - 1]];
                boardColors[row] = [...boardColors[row - 1]];
              }
              board[0] = Array(COLS).fill(0);
              boardColors[0] = Array(COLS).fill("#000");
              linesCleared++;
              y++;
            }
          }
          if (linesCleared > 0) {
            score += LINE_SCORES[linesCleared] * level;
            lines += linesCleared;
            const newLevel = Math.floor(lines / 10) + 1;
            if (newLevel > level) {
              level = newLevel;
              updateDropInterval();
            }
            updateUI();
          }
        }

        function updateDropInterval() {
          dropInterval = Math.max(80, 500 - (level - 1) * 35);
        }

        function movePiece(dx, dy) {
          if (!gameRunning) return false;
          currentX += dx;
          currentY += dy;
          if (collision()) {
            currentX -= dx;
            currentY -= dy;
            if (dy === 1) {
              mergePiece();
              dropCounter = 0;
            }
            return false;
          }
          return true;
        }

        function rotatePiece() {
          if (!gameRunning) return;
          const rotated = currentPiece.shape[0].map((_, idx) =>
            currentPiece.shape.map((row) => row[idx]).reverse(),
          );
          const originalShape = currentPiece.shape;
          currentPiece.shape = rotated;
          if (collision()) {
            currentPiece.shape = originalShape;
            for (let offset of [-1, 1, -2, 2]) {
              currentX += offset;
              currentPiece.shape = rotated;
              if (!collision()) return;
              currentX -= offset;
            }
            currentPiece.shape = originalShape;
          }
        }

        function hardDrop() {
          if (!gameRunning) return;
          while (!collision()) currentY++;
          currentY--;
          mergePiece();
          dropCounter = 0;
        }

        function draw() {
          ctx.fillStyle = "#03050b";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Grid lines
          ctx.strokeStyle = "rgba(0, 255, 255, 0.15)";
          ctx.lineWidth = 0.5;
          for (let x = 0; x <= COLS; x++) {
            ctx.beginPath();
            ctx.moveTo(x * BLOCK_SIZE, 0);
            ctx.lineTo(x * BLOCK_SIZE, canvas.height);
            ctx.stroke();
          }
          for (let y = 0; y <= ROWS; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * BLOCK_SIZE);
            ctx.lineTo(canvas.width, y * BLOCK_SIZE);
            ctx.stroke();
          }

          // Placed blocks
          for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
              if (board[y][x] === 1) {
                ctx.fillStyle = boardColors[y][x];
                ctx.shadowBlur = 3;
                ctx.fillRect(
                  x * BLOCK_SIZE + 1,
                  y * BLOCK_SIZE + 1,
                  BLOCK_SIZE - 2,
                  BLOCK_SIZE - 2,
                );
                ctx.strokeStyle = "#0ff";
                ctx.strokeRect(
                  x * BLOCK_SIZE + 1,
                  y * BLOCK_SIZE + 1,
                  BLOCK_SIZE - 2,
                  BLOCK_SIZE - 2,
                );
              }
            }
          }

          // Current piece
          if (currentPiece) {
            for (let r = 0; r < currentPiece.shape.length; r++) {
              for (let c = 0; c < currentPiece.shape[0].length; c++) {
                if (currentPiece.shape[r][c]) {
                  const x = (currentX + c) * BLOCK_SIZE;
                  const y = (currentY + r) * BLOCK_SIZE;
                  ctx.fillStyle = currentPiece.color;
                  ctx.shadowBlur = 5;
                  ctx.fillRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                  ctx.strokeStyle = "#fff";
                  ctx.strokeRect(x + 1, y + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                }
              }
            }
          }

          ctx.shadowBlur = 0;

          // Messages
          if (
            (!gameRunning && gameOverFlag) ||
            (!gameRunning && gameOverFlag === false)
          ) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 70);
            ctx.fillStyle = "#0ff";
            ctx.font = `bold ${Math.max(12, BLOCK_SIZE * 0.6)}px monospace`;
            ctx.fillText("GAME OVER", canvas.width / 2 - 45, canvas.height / 2);
            ctx.font = `${Math.max(9, BLOCK_SIZE * 0.45)}px monospace`;
            ctx.fillText(
              "PRESS START",
              canvas.width / 2 - 38,
              canvas.height / 2 + 28,
            );
          } else if (!gameRunning && !gameOverFlag) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, canvas.height / 2 - 35, canvas.width, 60);
            ctx.fillStyle = "#0ff";
            ctx.font = `bold ${Math.max(12, BLOCK_SIZE * 0.6)}px monospace`;
            ctx.fillText("TETRIS", canvas.width / 2 - 32, canvas.height / 2);
            ctx.font = `${Math.max(9, BLOCK_SIZE * 0.45)}px monospace`;
            ctx.fillText(
              "PRESS START",
              canvas.width / 2 - 38,
              canvas.height / 2 + 25,
            );
          }
        }

        function gameLoop(currentTime) {
          if (!lastTimestamp) lastTimestamp = currentTime;
          const deltaTime = Math.min(100, currentTime - lastTimestamp);
          lastTimestamp = currentTime;
          if (gameRunning) {
            dropCounter += deltaTime;
            if (dropCounter >= dropInterval) {
              movePiece(0, 1);
              dropCounter = 0;
            }
          }
          draw();
          requestAnimationFrame(gameLoop);
        }

        function startGame() {
          board = Array(ROWS)
            .fill()
            .map(() => Array(COLS).fill(0));
          boardColors = Array(ROWS)
            .fill()
            .map(() => Array(COLS).fill("#000"));
          score = 0;
          lines = 0;
          level = 1;
          gameRunning = true;
          gameOverFlag = false;
          dropCounter = 0;
          updateDropInterval();
          nextPiece = getRandomTetromino();
          spawnNewPiece();
          updateUI();
          drawNextPiece();
          draw();
        }

        function resetGame() {
          startGame();
        }

        function handleKeyDown(e) {
          const key = e.key.toLowerCase();
          if (
            key === "arrowleft" ||
            key === "arrowright" ||
            key === "arrowdown" ||
            key === "arrowup" ||
            key === " " ||
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d" ||
            key === "r"
          ) {
            e.preventDefault();
          }
          if (
            !gameRunning &&
            (key === " " || key === "arrowup" || key === "r")
          ) {
            startGame();
            return;
          }
          if (!gameRunning) return;
          if (key === "arrowleft" || key === "a") movePiece(-1, 0);
          if (key === "arrowright" || key === "d") movePiece(1, 0);
          if (key === "arrowdown" || key === "s") movePiece(0, 1);
          if (key === "arrowup" || key === "w" || key === "r") rotatePiece();
          if (key === " ") hardDrop();
          draw();
        }

        window.addEventListener("keydown", handleKeyDown);
        document.getElementById("tetrisStart").onclick = startGame;
        document.getElementById("tetrisReset").onclick = resetGame;
        document.getElementById("tetrisLeft").onclick = () => movePiece(-1, 0);
        document.getElementById("tetrisRight").onclick = () => movePiece(1, 0);
        document.getElementById("tetrisDown").onclick = () => movePiece(0, 1);
        document.getElementById("tetrisRotate").onclick = () => rotatePiece();
        document.getElementById("tetrisDrop").onclick = () => hardDrop();

        // Initial draw and loop
        adjustBlockSize();
        draw();
        requestAnimationFrame(gameLoop);
      })();
    </script>
  </body>
</html>
