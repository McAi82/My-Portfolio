<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Mcyor · PACMAN | 3D NEON</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: radial-gradient(circle at 20% 30%, #03050b, #000);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        animation: gridFloat 20s infinite alternate;
      }
      @keyframes gridFloat {
        0% {
          transform: translateZ(0) rotateX(0deg);
          opacity: 0.3;
        }
        100% {
          transform: translateZ(10px) rotateX(2deg);
          opacity: 0.7;
        }
      }
      .game-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 600px;
        perspective: 1200px;
        margin: 0 auto;
      }
      .game-panel {
        background: rgba(5, 8, 18, 0.85);
        backdrop-filter: blur(12px);
        border-radius: 1.5rem;
        padding: 0.8rem;
        border: 1px solid rgba(0, 255, 255, 0.4);
        box-shadow:
          0 25px 45px -12px black,
          0 0 0 2px rgba(0, 255, 255, 0.2) inset,
          0 0 18px rgba(0, 255, 255, 0.6);
      }
      .game-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 0.7rem;
        border-bottom: 2px solid #0ff;
        padding-bottom: 0.5rem;
      }
      .game-title {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 1.2rem;
        background: linear-gradient(135deg, #0ff, #f0f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .stats-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        background: rgba(0, 0, 0, 0.5);
        padding: 0.4rem 0.8rem;
        margin-bottom: 0.7rem;
        border: 1px solid rgba(0, 255, 255, 0.3);
      }
      .stat {
        display: flex;
        gap: 0.3rem;
        align-items: baseline;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
      }
      .stat-value {
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 800;
        color: #0ff;
        text-shadow: 0 0 5px #0ff;
      }
      button {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #0ff;
        padding: 0.3rem 0.6rem;
        border-radius: 40px;
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
        font-size: 0.65rem;
        color: #0ff;
        cursor: pointer;
        transition: all 0.2s;
      }
      button:hover,
      button:active {
        background: #0ff;
        color: #000;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
      }
      .canvas-area {
        background: rgba(0, 0, 0, 0.55);
        border-radius: 20px;
        padding: 0.4rem;
        border: 1px solid rgba(0, 255, 255, 0.4);
        display: flex;
        justify-content: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.3);
        background: #000;
        cursor: pointer;
      }
      .dpad {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.8rem;
        flex-wrap: wrap;
      }
      .dpad button {
        width: 55px;
        height: 55px;
        font-size: 1.3rem;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #0ff;
        color: #0ff;
        cursor: pointer;
        transition: 0.05s linear;
      }
      .dpad button:active {
        background: #0ff;
        color: #000;
        transform: scale(0.92);
      }

      @media (max-width: 550px) {
        body {
          padding: 0.5rem;
        }
        .game-panel {
          padding: 0.6rem;
        }
        .game-title {
          font-size: 1rem;
        }
        .stat-value {
          font-size: 0.85rem;
        }
        .dpad button {
          width: 48px;
          height: 48px;
          font-size: 1.1rem;
        }
      }
      @media (max-width: 450px) {
        .dpad button {
          width: 42px;
          height: 42px;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-panel">
        <div class="game-header">
          <span class="game-title">◈ PACMAN · 3D NEON</span>
          <span style="color: #0ff; font-size: 0.65rem">⚡ ARCADE</span>
        </div>
        <div class="stats-row">
          <div class="stat">
            <span class="stat-value" id="score">0</span><span>SCORE</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="lives">3</span><span>LIVES</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="level">1</span><span>LVL</span>
          </div>
        </div>
        <div class="canvas-area">
          <canvas id="pacCanvas" width="504" height="552"></canvas>
        </div>
        <div class="dpad">
          <button id="upBtn">▲</button>
          <button id="downBtn">▼</button>
          <button id="leftBtn">◀</button>
          <button id="rightBtn">▶</button>
        </div>
        <div
          style="
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.6rem;
          "
        >
          <button id="startBtn">START</button>
          <button id="resetBtn">RESET</button>
        </div>
        <div
          style="
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.55rem;
            color: #5e6f8d;
          "
        >
          ◉ TOUCH D-PAD | ARROWS / WASD | SPACE PAUSE
        </div>
      </div>
    </div>

    <script>
      (function () {
        // CANVAS
        const canvas = document.getElementById("pacCanvas");
        const ctx = canvas.getContext("2d");

        // FIXED: Set canvas size properly
        canvas.width = 504;
        canvas.height = 552;

        // GAME CONSTANTS
        const TILE_SIZE = 24;
        const COLS = 21;
        const ROWS = 23;

        // Direction vectors
        const DIRS = [
          { x: 0, y: -1 },
          { x: 0, y: 1 },
          { x: -1, y: 0 },
          { x: 1, y: 0 },
        ];

        // Original map layout - PACMAN MAZE
        const RAW_MAP = [
          "#####################",
          "#........#........#.#",
          "#.###.###.#.###.###.#",
          "#o###.###.#.###.###o#",
          "#.###.###.#.###.###.#",
          "#...................#",
          "#.###.#.####.#.###..#",
          "#.....#...#..#.....#",
          "#####.###.####.#####",
          "    #.#  G  #.#     ",
          "#####.# #### #.#####",
          "#.........#.........#",
          "#.###.###.#.###.###.#",
          "#o..#.....P.....#..o#",
          "###.#.#.#####.#.#.###",
          "#.....#...#..#.....#",
          "#.###.###.#.###.###.#",
          "#.###.###.#.###.###.#",
          "#...................#",
          "#####################",
          "                     ",
          "                     ",
          "                     ",
        ];

        // GAME STATE
        let board = [];
        let pelletsTotal = 0;
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameRunning = false;
        let paused = false;

        // Pacman
        let pac = {
          x: 0,
          y: 0,
          tileX: 0,
          tileY: 0,
          dir: { x: 0, y: 0 },
          nextDir: { x: 0, y: 0 },
          speed: 2.2,
        };

        // Ghosts
        let ghosts = [];
        const GHOST_COLORS = ["#ff3b3b", "#ffb86b", "#66d9ef", "#b38fff"];

        function updateUI() {
          document.getElementById("score").innerText = score;
          document.getElementById("lives").innerText = lives;
          document.getElementById("level").innerText = level;
        }

        function isTileWalkable(tileX, tileY) {
          if (tileX < 0 || tileX >= COLS || tileY < 0 || tileY >= ROWS)
            return false;
          const cell = board[tileY][tileX];
          return cell !== "#";
        }

        function updatePacmanTile() {
          pac.tileX = Math.floor(pac.x / TILE_SIZE);
          pac.tileY = Math.floor(pac.y / TILE_SIZE);
          pac.tileX = Math.max(0, Math.min(COLS - 1, pac.tileX));
          pac.tileY = Math.max(0, Math.min(ROWS - 1, pac.tileY));
        }

        // Initialize level
        function initLevel() {
          // Deep copy the map
          board = RAW_MAP.map((row) => row.split(""));
          pelletsTotal = 0;
          ghosts = [];

          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const ch = board[r][c];
              if (ch === "P") {
                pac.x = c * TILE_SIZE + TILE_SIZE / 2;
                pac.y = r * TILE_SIZE + TILE_SIZE / 2;
                pac.tileX = c;
                pac.tileY = r;
                pac.dir = { x: 0, y: 0 };
                pac.nextDir = { x: 0, y: 0 };
                board[r][c] = " ";
              }
              if (ch === "G") {
                ghosts.push({
                  x: c * TILE_SIZE + TILE_SIZE / 2,
                  y: r * TILE_SIZE + TILE_SIZE / 2,
                  tileX: c,
                  tileY: r,
                  dir: { x: 1, y: 0 },
                  color: GHOST_COLORS[ghosts.length % GHOST_COLORS.length],
                  speed: 1.4,
                  frightened: 0,
                  homeX: c * TILE_SIZE + TILE_SIZE / 2,
                  homeY: r * TILE_SIZE + TILE_SIZE / 2,
                  homeTileX: c,
                  homeTileY: r,
                });
                board[r][c] = " ";
              }
              if (ch === "." || ch === "o") pelletsTotal++;
            }
          }
          updateUI();
          draw(); // Force redraw
        }

        function isWalkable(px, py) {
          const r = Math.floor(py / TILE_SIZE);
          const c = Math.floor(px / TILE_SIZE);
          if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return true;
          return board[r][c] !== "#";
        }

        function movePacman() {
          updatePacmanTile();

          const centerX = pac.tileX * TILE_SIZE + TILE_SIZE / 2;
          const centerY = pac.tileY * TILE_SIZE + TILE_SIZE / 2;
          const atCenter =
            Math.abs(pac.x - centerX) < 1.5 && Math.abs(pac.y - centerY) < 1.5;

          if (atCenter && (pac.nextDir.x !== 0 || pac.nextDir.y !== 0)) {
            const testX = pac.tileX + pac.nextDir.x;
            const testY = pac.tileY + pac.nextDir.y;
            if (isTileWalkable(testX, testY)) {
              pac.dir = { ...pac.nextDir };
            }
          }

          if (pac.dir.x !== 0 || pac.dir.y !== 0) {
            const newX = pac.x + pac.dir.x * pac.speed;
            const newY = pac.y + pac.dir.y * pac.speed;
            const nextTileX = Math.floor(newX / TILE_SIZE);
            const nextTileY = Math.floor(newY / TILE_SIZE);

            if (isTileWalkable(nextTileX, nextTileY)) {
              pac.x = newX;
              pac.y = newY;
            } else {
              pac.dir = { x: 0, y: 0 };
              pac.x = centerX;
              pac.y = centerY;
            }
          }

          // Tunnel wrap
          if (pac.x < -TILE_SIZE / 2) pac.x = COLS * TILE_SIZE + TILE_SIZE / 2;
          if (pac.x > COLS * TILE_SIZE + TILE_SIZE / 2) pac.x = -TILE_SIZE / 2;

          updatePacmanTile();
        }

        function eatPellet() {
          const r = pac.tileY;
          const c = pac.tileX;
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

          const cell = board[r][c];
          if (cell === ".") {
            score += 10;
            board[r][c] = " ";
            pelletsTotal--;
            updateUI();
          } else if (cell === "o") {
            score += 50;
            board[r][c] = " ";
            pelletsTotal--;
            updateUI();
            ghosts.forEach((g) => {
              g.frightened = 400;
            });
          }

          if (pelletsTotal === 0) {
            level++;
            initLevel();
          }
        }

        function getNextDirectionBFS(startTile, targetTile, currentDir) {
          if (!startTile || !targetTile) return currentDir;
          if (startTile.x === targetTile.x && startTile.y === targetTile.y)
            return currentDir;

          const queue = [{ x: startTile.x, y: startTile.y, path: [] }];
          const visited = new Set();
          visited.add(`${startTile.x},${startTile.y}`);

          while (queue.length > 0) {
            const current = queue.shift();
            for (const dir of DIRS) {
              const nx = current.x + dir.x;
              const ny = current.y + dir.y;
              const key = `${nx},${ny}`;

              if (nx === targetTile.x && ny === targetTile.y) {
                const firstStep =
                  current.path.length > 0 ? current.path[0] : dir;
                return firstStep;
              }

              if (!visited.has(key) && isTileWalkable(nx, ny)) {
                visited.add(key);
                const newPath = [...current.path, dir];
                queue.push({ x: nx, y: ny, path: newPath });
              }
            }
          }
          return currentDir;
        }

        function moveGhosts() {
          const pacTile = { x: pac.tileX, y: pac.tileY };

          for (let g of ghosts) {
            if (g.frightened > 0) {
              g.frightened--;
              if (Math.random() < 0.05) {
                const validDirs = DIRS.filter((dir) => {
                  const nx = g.tileX + dir.x;
                  const ny = g.tileY + dir.y;
                  return isTileWalkable(nx, ny);
                });
                if (validDirs.length > 0) {
                  g.dir =
                    validDirs[Math.floor(Math.random() * validDirs.length)];
                }
              }
            } else {
              const ghostTile = { x: g.tileX, y: g.tileY };
              const nextDir = getNextDirectionBFS(ghostTile, pacTile, g.dir);
              if (nextDir) g.dir = nextDir;
            }

            const newX = g.x + g.dir.x * g.speed;
            const newY = g.y + g.dir.y * g.speed;

            if (isWalkable(newX, newY)) {
              g.x = newX;
              g.y = newY;
            }

            g.tileX = Math.floor(g.x / TILE_SIZE);
            g.tileY = Math.floor(g.y / TILE_SIZE);
            g.tileX = Math.max(0, Math.min(COLS - 1, g.tileX));
            g.tileY = Math.max(0, Math.min(ROWS - 1, g.tileY));

            if (g.x < -TILE_SIZE / 2) g.x = COLS * TILE_SIZE + TILE_SIZE / 2;
            if (g.x > COLS * TILE_SIZE + TILE_SIZE / 2) g.x = -TILE_SIZE / 2;
          }
        }

        function checkCollisions() {
          for (let g of ghosts) {
            const dist = Math.hypot(g.x - pac.x, g.y - pac.y);
            if (dist < TILE_SIZE * 0.65) {
              if (g.frightened > 0) {
                score += 200;
                updateUI();
                g.x = g.homeX;
                g.y = g.homeY;
                g.tileX = g.homeTileX;
                g.tileY = g.homeTileY;
                g.frightened = 0;
                g.dir = { x: 1, y: 0 };
              } else {
                lives--;
                updateUI();
                if (lives <= 0) {
                  gameRunning = false;
                } else {
                  initLevel();
                }
                return;
              }
            }
          }
        }

        // DRAW FUNCTION - FIXED
        function draw() {
          // Clear canvas
          ctx.fillStyle = "#03050b";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw maze and pellets
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const ch = board[r][c];
              const x = c * TILE_SIZE;
              const y = r * TILE_SIZE;

              if (ch === "#") {
                // Wall
                ctx.fillStyle = "#111a2a";
                ctx.fillRect(x, y, TILE_SIZE - 1, TILE_SIZE - 1);
                ctx.strokeStyle = "#0ff";
                ctx.strokeRect(x + 0.5, y + 0.5, TILE_SIZE - 2, TILE_SIZE - 2);
              } else if (ch === ".") {
                // Small pellet
                ctx.fillStyle = "#ffea00";
                ctx.shadowBlur = 4;
                ctx.beginPath();
                ctx.arc(
                  x + TILE_SIZE / 2,
                  y + TILE_SIZE / 2,
                  3,
                  0,
                  Math.PI * 2,
                );
                ctx.fill();
              } else if (ch === "o") {
                // Power pellet
                ctx.fillStyle = "#f0f";
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(
                  x + TILE_SIZE / 2,
                  y + TILE_SIZE / 2,
                  8,
                  0,
                  Math.PI * 2,
                );
                ctx.fill();
              }
            }
          }

          ctx.shadowBlur = 0;

          // Draw ghosts
          for (let g of ghosts) {
            ctx.fillStyle = g.frightened > 0 ? "#00ffff" : g.color;
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.arc(g.x, g.y, TILE_SIZE * 0.38, 0, Math.PI * 2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(g.x - 6, g.y - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(g.x + 6, g.y - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(g.x - 5, g.y - 4, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(g.x + 7, g.y - 4, 2, 0, Math.PI * 2);
            ctx.fill();
          }

          // Draw Pacman
          ctx.fillStyle = "#ffea00";
          ctx.shadowBlur = 8;
          const angle = (Date.now() * 0.012) % (Math.PI * 2);
          const mouthAngle = 0.3 + Math.sin(angle) * 0.2;
          let dirAngle = 0;
          if (pac.dir.x === 1) dirAngle = 0;
          else if (pac.dir.x === -1) dirAngle = Math.PI;
          else if (pac.dir.y === 1) dirAngle = Math.PI / 2;
          else if (pac.dir.y === -1) dirAngle = -Math.PI / 2;

          ctx.beginPath();
          ctx.arc(
            pac.x,
            pac.y,
            TILE_SIZE * 0.4,
            dirAngle + mouthAngle,
            dirAngle + Math.PI * 2 - mouthAngle,
          );
          ctx.lineTo(pac.x, pac.y);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Messages
          if (!gameRunning && lives <= 0) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 70);
            ctx.fillStyle = "#0ff";
            ctx.font = "bold 18px monospace";
            ctx.fillText("GAME OVER", canvas.width / 2 - 60, canvas.height / 2);
            ctx.font = "12px monospace";
            ctx.fillText(
              "PRESS START",
              canvas.width / 2 - 45,
              canvas.height / 2 + 28,
            );
          } else if (!gameRunning && lives > 0) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, canvas.height / 2 - 35, canvas.width, 60);
            ctx.fillStyle = "#0ff";
            ctx.font = "bold 18px monospace";
            ctx.fillText("PACMAN", canvas.width / 2 - 45, canvas.height / 2);
            ctx.font = "12px monospace";
            ctx.fillText(
              "PRESS START",
              canvas.width / 2 - 45,
              canvas.height / 2 + 28,
            );
          } else if (paused && gameRunning) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, canvas.height / 2 - 30, canvas.width, 50);
            ctx.fillStyle = "#0ff";
            ctx.font = "bold 18px monospace";
            ctx.fillText(
              "PAUSED",
              canvas.width / 2 - 40,
              canvas.height / 2 + 5,
            );
          }
        }

        // GAME LOOP
        let lastTimestamp = 0;
        let lastMoveTime = 0;

        function gameLoop(timestamp) {
          if (!lastTimestamp) lastTimestamp = timestamp;
          const delta = Math.min(33, timestamp - lastTimestamp);
          lastTimestamp = timestamp;

          if (gameRunning && !paused) {
            movePacman();
            eatPellet();
            moveGhosts();
            checkCollisions();
          }

          draw();
          requestAnimationFrame(gameLoop);
        }

        // CONTROLS
        function setDirection(x, y) {
          if (!gameRunning) return;
          pac.nextDir = { x, y };
        }

        function handleKeyDown(e) {
          const key = e.key.toLowerCase();
          if (
            key === "arrowup" ||
            key === "arrowdown" ||
            key === "arrowleft" ||
            key === "arrowright" ||
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d" ||
            key === " " ||
            key === "p"
          ) {
            e.preventDefault();
          }

          if (
            !gameRunning &&
            (key === "arrowup" ||
              key === "arrowdown" ||
              key === "arrowleft" ||
              key === "arrowright" ||
              key === "w" ||
              key === "a" ||
              key === "s" ||
              key === "d")
          ) {
            startGame();
          }

          if (key === "arrowleft" || key === "a") setDirection(-1, 0);
          if (key === "arrowright" || key === "d") setDirection(1, 0);
          if (key === "arrowup" || key === "w") setDirection(0, -1);
          if (key === "arrowdown" || key === "s") setDirection(0, 1);
          if (key === " " || key === "p") {
            if (gameRunning) paused = !paused;
          }
        }

        function startGame() {
          score = 0;
          lives = 3;
          level = 1;
          gameRunning = true;
          paused = false;
          initLevel();
          updateUI();
        }

        function resetGame() {
          startGame();
        }

        // EVENT LISTENERS
        window.addEventListener("keydown", handleKeyDown);
        document
          .getElementById("startBtn")
          .addEventListener("click", startGame);
        document
          .getElementById("resetBtn")
          .addEventListener("click", resetGame);

        // Touch D-pad
        document.getElementById("upBtn").addEventListener("click", () => {
          setDirection(0, -1);
          if (!gameRunning) startGame();
        });
        document.getElementById("downBtn").addEventListener("click", () => {
          setDirection(0, 1);
          if (!gameRunning) startGame();
        });
        document.getElementById("leftBtn").addEventListener("click", () => {
          setDirection(-1, 0);
          if (!gameRunning) startGame();
        });
        document.getElementById("rightBtn").addEventListener("click", () => {
          setDirection(1, 0);
          if (!gameRunning) startGame();
        });

        // Initialize and start
        initLevel();
        updateUI();
        gameLoop(0);
      })();
    </script>
  </body>
</html>
